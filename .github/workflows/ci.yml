name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    # GitHub's image with Xcode 27 (a preview label when this was written);
    # free for public repositories.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.2
      # Plugins and package versions are trusted here as Xcode's dialogs
      # would be: the generator plugin, and only the versions in
      # Package.resolved.
      XCODEBUILD_FLAGS: >-
        -project PuzzleQuest.xcodeproj -scheme PuzzleQuest
        -derivedDataPath build/DerivedData
        -skipPackagePluginValidation -onlyUsePackageVersionsFromResolvedFile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 27.2
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app
      # The test server is the API's own repository, which runs on Node 24.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The description the client is generated from must be the pinned
      # release's, with scripts/tolerant-openapi.jq applied.
      - name: Check the generated client's description
        run: |
          scripts/update-api.sh
          git diff --exit-code PuzzleQuestKit/Sources/PuzzleQuestAPI/openapi.json

      - name: Unit tests (on the Mac)
        working-directory: PuzzleQuestKit
        run: swift test --force-resolved-versions --skip ContractTests

      - name: Build the app
        run: xcodebuild build-for-testing $XCODEBUILD_FLAGS -destination "$DESTINATION"

      - name: Start the test server
        run: |
          scripts/start-test-server.sh
          set -a; source .test-server/env; set +a
          for name in $(sed -n 's/=.*//p' .test-server/env); do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done

      # Without the server's variables the tests would be skipped, not run.
      - name: Contract tests (against the test server)
        working-directory: PuzzleQuestKit
        run: |
          : "${PQ_TEST_SERVER_URL:?the test server is not set}"
          swift test --force-resolved-versions --filter ContractTests

      - name: Unit and UI tests (in the simulator, against the test server)
        run: |
          : "${TEST_RUNNER_PQ_TEST_SERVER_URL:?the test server is not set}"
          xcodebuild test-without-building $XCODEBUILD_FLAGS -destination "$DESTINATION" \
            -resultBundlePath build/Tests.xcresult

      - name: Stop the test server
        if: always()
        run: scripts/stop-test-server.sh

      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            build/Tests.xcresult
            .test-server/*.log
          if-no-files-found: ignore
